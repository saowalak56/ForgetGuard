<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForgetGuard</title>
<style>
body{font-family:Arial,"Noto Sans Thai",sans-serif;margin:0;background:#eef6ff;color:#263238}header{background:linear-gradient(135deg,#1565c0,#42a5f5);color:white;padding:25px}main{max-width:950px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{border:0;border-radius:9px;padding:11px 16px;font-weight:bold;cursor:pointer}.tab{background:white;color:#1565c0}.active,.primary{background:#1565c0;color:white}.danger{background:#ef5350;color:white}.secondary{background:#eceff1;color:#37474f}.page{display:none}.show{display:block}.card{background:white;padding:22px;border-radius:16px;margin-bottom:18px;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{font-weight:bold;display:block;margin-bottom:6px}input,select{width:100%;padding:12px;border:1px solid #ccd5db;border-radius:9px;font-size:16px;box-sizing:border-box}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;border:1px solid #e1e6e9;border-radius:10px;margin:8px 0}.ok{color:#2e7d32;font-weight:bold}.warn{color:#e65100;font-weight:bold}.alert{padding:14px;border-radius:10px;margin:10px 0}.green{background:#e8f5e9}.orange{background:#fff3e0}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:white;padding:18px;border-radius:14px}.stat b{display:block;font-size:28px;color:#1565c0}.small{font-size:13px;color:#607d8b}@media(max-width:650px){.grid,.stats{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<header><h1>🛡️ ForgetGuard</h1><div>ระบบเช็กลิสต์และแจ้งเตือนการลืมสิ่งของ</div></header><main>
<div class="tabs"><button class="tab active" onclick="page('home',this)">🏠 หน้าหลัก</button><button class="tab" onclick="page('items',this)">📦 สิ่งของ</button><button class="tab" onclick="page('check',this)">✅ เช็กก่อนออก</button><button class="tab" onclick="page('history',this)">📊 ประวัติ</button></div>

<section id="home" class="page show"><div class="stats"><div class="stat">ทั้งหมด<b id="n">0</b></div><div class="stat">ตรวจแล้ว<b id="c">0</b></div><div class="stat">ยังไม่ตรวจ<b id="m">0</b></div></div><div class="card"><h2>🔔 สถานะ</h2><div id="alert"></div><div id="homeList"></div></div></section>

<section id="items" class="page"><div class="card"><h2>➕ เพิ่มสิ่งของ</h2><form id="form" class="grid"><div><label>ชื่อสิ่งของ</label><input id="name" placeholder="เช่น บัตรพนักงาน" required></div><div><label>หมวดหมู่</label><select id="cat"><option>ของใช้ส่วนตัว</option><option>อุปกรณ์ทำงาน</option><option>เอกสาร</option><option>อิเล็กทรอนิกส์</option><option>อื่น ๆ</option></select></div><div class="full"><label>รายละเอียด</label><input id="note" placeholder="เช่น ต้องนำไปทุกวัน"></div><div class="full"><button class="primary">บันทึกสิ่งของ</button></div></form></div><div class="card"><h2>📦 รายการสิ่งของ</h2><div id="list"></div></div></section>

<section id="check" class="page"><div class="card"><h2>✅ เช็กของก่อนออก</h2><p class="small">กด “นำไปแล้ว” เมื่อคุณตรวจสอบสิ่งของจริง</p><div id="checkList"></div><button class="secondary" onclick="resetCheck()">รีเซ็ต</button> <button class="primary" onclick="finish()">ตรวจสอบความครบ</button><div id="result"></div></div></section>

<section id="history" class="page"><div class="card"><h2>📊 ประวัติการตรวจ</h2><table><thead><tr><th>วันเวลา</th><th>ผล</th><th>ครบ</th><th>ไม่ครบ</th></tr></thead><tbody id="hist"></tbody></table></div></section>
</main>
<script>
let items=JSON.parse(localStorage.fgItems||'[]'), hist=JSON.parse(localStorage.fgHist||'[]'), checked=new Set();
const $=id=>document.getElementById(id);
function save(){localStorage.fgItems=JSON.stringify(items);localStorage.fgHist=JSON.stringify(hist)}
function page(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));$(id).classList.add('show');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
$('form').onsubmit=e=>{e.preventDefault();items.push({id:Date.now().toString(),name:$('name').value.trim(),cat:$('cat').value,note:$('note').value.trim()});save();e.target.reset();render();alert('บันทึกสิ่งของแล้ว')};
function render(){let miss=items.filter(x=>!checked.has(x.id));$('n').textContent=items.length;$('c').textContent=checked.size;$('m').textContent=miss.length;
$('alert').innerHTML=items.length?(miss.length?'<div class="alert orange">⚠️ ยังไม่ได้ตรวจ: <b>'+miss.map(x=>x.name).join(', ')+'</b></div>':'<div class="alert green">✅ ตรวจครบทุกสิ่งของแล้ว</div>'):'<div class="alert orange">ยังไม่มีสิ่งของ</div>';
$('homeList').innerHTML=items.map(x=>'<div class="item">📦 '+x.name+' <span class="'+(checked.has(x.id)?'ok':'warn')+'">'+(checked.has(x.id)?'✅ พร้อม':'⚠️ ยังไม่ตรวจ')+'</span></div>').join('');
$('list').innerHTML=items.length?items.map(x=>'<div class="item"><div><b>'+x.name+'</b><div class="small">'+x.cat+(x.note?' · '+x.note:'')+'</div></div><button class="danger" onclick="del(\''+x.id+'\')">ลบ</button></div>').join(''):'<p>ยังไม่มีรายการ</p>';
$('checkList').innerHTML=items.length?items.map(x=>'<div class="item"><div><b>'+x.name+'</b></div><button class="'+(checked.has(x.id)?'secondary':'primary')+'" onclick="toggle(\''+x.id+'\')">'+(checked.has(x.id)?'ยกเลิก':'นำไปแล้ว')+'</button></div>').join(''):'<p>กรุณาเพิ่มสิ่งของก่อน</p>';
$('hist').innerHTML=hist.length?hist.map(x=>'<tr><td>'+x.t+'</td><td>'+(x.ok?'✅ ครบ':'⚠️ ไม่ครบ')+'</td><td>'+x.c+'</td><td>'+x.m+'</td></tr>').join(''):'<tr><td colspan="4">ยังไม่มีประวัติ</td></tr>'}
function toggle(id){checked.has(id)?checked.delete(id):checked.add(id);render()}
function resetCheck(){checked.clear();$('result').innerHTML='';render()}
function finish(){let miss=items.filter(x=>!checked.has(x.id));let ok=items.length>0&&!miss.length;hist.unshift({t:new Date().toLocaleString('th-TH'),ok,c:checked.size,m:miss.length});hist=hist.slice(0,30);save();$('result').innerHTML=ok?'<div class="alert green">🎉 ของครบแล้ว พร้อมออก</div>':'<div class="alert orange">⚠️ คุณยังไม่ได้ตรวจ: '+miss.map(x=>x.name).join(', ')+'</div>';render()}
function del(id){if(confirm('ลบสิ่งของนี้หรือไม่?')){items=items.filter(x=>x.id!==id);checked.delete(id);save();render()}}
render();
</script></body></html>
